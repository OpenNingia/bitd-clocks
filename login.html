<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8">
    <script src="js/app.js" defer=""></script>
    <script src="js/onl.js" defer=""></script>
    <script src="js/pocketbase.umd.js" defer=""></script>
    <script src="https://unpkg.com/alpinejs" defer></script>

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ffffff">

    <link rel="manifest" href="bitd-clocks.webmanifest" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <section class="section">
        <div class="container">
            <div class="columns is-centered">
                <div class="column is-one-third">
                    <h1 class="title has-text-centered">Login</h1>
                    <div x-data="clocks">
                        <div class="field">
                            <label class="label">Email</label>
                            <div class="control">
                                <input class="input" type="email" placeholder="e.g. alex@example.com" x-model="email">
                            </div>
                        </div>

                        <div class="field">
                            <label class="label">Password</label>
                            <div class="control">
                                <input class="input" type="password" placeholder="********" x-model="password">
                            </div>
                        </div>

                        <div class="field">
                            <div class="control">
                                <button class="button is-primary is-fullwidth"
                                    x-on:click="login(email, password)">Login</button>
                            </div>
                        </div>

                        <div class="field" x-show="error">
                            <p class="has-text-danger" x-text="error"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
